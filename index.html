
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>PIXELVERSE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #080d19;
  color: #e8f3ff;
  font-family: monospace;
}

.container {
  max-width: 900px;
  margin: auto;
}

header {
  color: #62e6df;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

.panel {
  background: #101a2a;
  border: 1px solid #263b54;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 14px;
}

h3 {
  color: #62e6df;
  font-size: 12px;
  letter-spacing: 2px;
}

.clock {
  font-size: clamp(45px, 12vw, 75px);
  font-weight: bold;
  color: white;
}

.date {
  color: #8da1b9;
  margin-top: 8px;
}

canvas {
  width: 100%;
  height: auto;
  image-rendering: pixelated;
  border-radius: 8px;
  background: #071c35;
}

button {
  background: #17263a;
  color: white;
  border: 1px solid #38506d;
  padding: 10px;
  margin: 4px 2px;
  border-radius: 7px;
  font-family: monospace;
}

button:active {
  background: #31516e;
}

.timer {
  text-align: center;
  font-size: 45px;
  color: #ffe18a;
  margin: 15px;
}

.center {
  text-align: center;
}

#weather {
  color: #ffe18a;
  font-size: 24px;
}

input {
  background: #080d19;
  border: 1px solid #38506d;
  color: white;
  padding: 10px;
  width: 65%;
  border-radius: 6px;
}

.quote {
  color: #ff75b8;
  line-height: 1.7;
}

#matrix {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  z-index: 10;
}

#matrix canvas {
  width: 100%;
  height: 100%;
}

#exit {
  position: absolute;
  top: 15px;
  right: 15px;
}

</style>
</head>

<body>

<div class="container">

<header>PIXELVERSE_</header>

<!-- PIXEL AQUARIUM -->

<div class="panel">
<h3>01 / PIXEL WORLD</h3>

<canvas id="world"
width="480" height="270"></canvas>

<div>
<button onclick="setMode('aquarium')">AQUARIUM</button>
<button onclick="setMode('landscape')">PIXEL WORLD</button>
<button onclick="setMode('rain')">RAIN</button>
<button onclick="startMatrix()">MATRIX</button>
</div>
</div>

<!-- DIGITAL CLOCK -->

<div class="panel">
<h3>02 / DIGITAL CLOCK</h3>

<div class="clock" id="clock">00:00:00</div>
<div class="date" id="date"></div>

</div>

<!-- STUDY TIMER -->

<div class="panel center">
<h3>03 / STUDY COMPANION</h3>

<div id="timer" class="timer">25:00</div>

<button onclick="startTimer()">START</button>
<button onclick="pauseTimer()">PAUSE</button>
<button onclick="resetTimer()">RESET</button>

<br>

<button onclick="setTimer(25)">25 MIN</button>
<button onclick="setTimer(5)">5 MIN BREAK</button>
<button onclick="setTimer(15)">15 MIN BREAK</button>

</div>

<!-- WEATHER -->

<div class="panel">
<h3>04 / WEATHER STATION</h3>

<div id="weather">--°C</div>
<p id="weatherInfo">Enter your city</p>

<input id="city" placeholder="Enter city">
<button onclick="getWeather()">UPDATE</button>

</div>

<!-- DAILY MESSAGE -->

<div class="panel">
<h3>05 / DAILY TRANSMISSION</h3>

<p class="quote" id="quote">
Your future is built by the tiny things
you do today.
</p>

<button onclick="newQuote()">NEW MESSAGE</button>
<button onclick="fullscreen()">FULLSCREEN</button>

</div>

</div>

<!-- MATRIX SCREEN -->

<div id="matrix">
<canvas id="matrixCanvas"></canvas>
<button id="exit" onclick="stopMatrix()">EXIT MATRIX</button>
</div>

<script>

// DIGITAL CLOCK

function updateClock() {

  let now = new Date();

  document.getElementById("clock")
  .textContent = now.toLocaleTimeString("en-GB");

  document.getElementById("date")
  .textContent = now.toDateString();

}

setInterval(updateClock, 1000);
updateClock();


// PIXEL WORLD

let canvas = document.getElementById("world");
let ctx = canvas.getContext("2d");

let mode = "aquarium";
let frame = 0;

let fish = [];

for(let i=0;i<7;i++) {
  fish.push({
    x: Math.random()*480,
    y: 70+Math.random()*140,
    speed: 0.5+Math.random()*1.5,
    color: ["#ffbd75","#ff75b8","#62e6df","#b9a0ff"][i%4]
  });
}

function setMode(m) {
  mode = m;
}

function drawWorld() {

  frame++;

  ctx.fillStyle =
    mode === "aquarium" ? "#071c35" : "#101b3c";

  ctx.fillRect(0,0,480,270);

  if(mode === "aquarium") {

    // Bubbles

    for(let i=0;i<30;i++) {
      let x=(i*83)%480;
      let y=(i*47+frame)%250;

      ctx.fillStyle="#8adbd9";
      ctx.fillRect(x,y,2,2);
    }

    // Water floor

    ctx.fillStyle="#123d50";
    ctx.fillRect(0,225,480,45);

    // Sea plants

    for(let i=0;i<15;i++) {
      ctx.fillStyle="#2b9b78";
      ctx.fillRect(i*35,195-(i%3)*5,5,30);
    }

    // Fish animation

    fish.forEach(f=>{

      f.x += f.speed;

      if(f.x>500) f.x=-20;

      ctx.fillStyle=f.color;

      ctx.fillRect(f.x,f.y,18,9);
      ctx.fillRect(f.x+14,f.y+2,8,5);
      ctx.fillRect(f.x+3,f.y+2,2,2);

    });

  } else {

    // Stars

    for(let i=0;i<35;i++) {
      ctx.fillStyle="#e8f3ff";
      ctx.fillRect((i*67)%480,(i*31)%130,2,2);
    }

    // Moon

    ctx.fillStyle="#ffe18a";
    ctx.fillRect(370,40,25,25);

    // Mountains

    ctx.fillStyle="#315b78";
    ctx.fillRect(0,165,130,70);

    ctx.fillStyle="#244b69";
    ctx.fillRect(70,135,140,100);

    ctx.fillStyle="#315b78";
    ctx.fillRect(190,158,120,77);

    // Ground

    ctx.fillStyle="#245347";
    ctx.fillRect(0,235,480,35);

    // Rain

    if(mode==="rain") {

      for(let i=0;i<80;i++) {

        ctx.fillStyle="#b9eaff";

        let x=(i*61+frame*2)%480;
        let y=(i*37+frame*4)%270;

        ctx.fillRect(x,y,1,6);

      }

    }

  }

  requestAnimationFrame(drawWorld);

}

drawWorld();


// POMODORO TIMER

let timeLeft = 25*60;
let timerInterval = null;

function displayTimer() {

  let mins = Math.floor(timeLeft/60);
  let secs = timeLeft%60;

  document.getElementById("timer").textContent =
    String(mins).padStart(2,"0")+":"+
    String(secs).padStart(2,"0");

}

function startTimer() {

  if(timerInterval) return;

  timerInterval = setInterval(()=>{

    if(timeLeft>0) {
      timeLeft--;
      displayTimer();
    } else {
      pauseTimer();
      document.getElementById("timer").textContent="DONE!";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }

  },1000);

}

function pauseTimer() {
  clearInterval(timerInterval);
  timerInterval=null;
}

function resetTimer() {
  pauseTimer();
  timeLeft=25*60;
  displayTimer();
}

function setTimer(minutes) {
  pauseTimer();
  timeLeft=minutes*60;
  displayTimer();
}

displayTimer();


// WEATHER STATION

async function getWeather() {

  let city=document.getElementById("city").value.trim();

  if(!city) return;

  document.getElementById("weatherInfo").textContent="Loading...";

  try {

    let geo=await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name="+
      encodeURIComponent(city)+"&count=1"
    );

    let location=await geo.json();

    if(!location.results) throw Error("City not found");

    let place=location.results[0];

    let url=
      `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto`;

    let response=await fetch(url);
    let data=await response.json();

    let w=data.current;

    document.getElementById("weather").textContent=
      Math.round(w.temperature_2m)+"°C";

    document.getElementById("weatherInfo").textContent=
      place.name+" | Humidity: "+w.relative_humidity_2m+
      "% | Wind: "+w.wind_speed_10m+" km/h";

  } catch(e) {

    document.getElementById("weatherInfo").textContent=
      "Weather unavailable. Check internet or city.";

  }

}

document.getElementById("city").value="Lucknow";
getWeather();


// MATRIX ANIMATION

let matrixCanvas=document.getElementById("matrixCanvas");
let mctx=matrixCanvas.getContext("2d");
let matrixAnimation;

function startMatrix() {

  document.getElementById("matrix").style.display="block";

  matrixCanvas.width=innerWidth;
  matrixCanvas.height=innerHeight;

  let columns=Math.floor(innerWidth/16);
  let drops=Array(columns).fill(1);

  function drawMatrix() {

    mctx.fillStyle="rgba(0,0,0,0.12)";
    mctx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);

    mctx.fillStyle="#53ff83";
    mctx.font="15px monospace";

    drops.forEach((y,i)=>{

      let char=String.fromCharCode(
        0x30A0+Math.random()*96
      );

      mctx.fillText(char,i*16,y*16);

      if(y*16>matrixCanvas.height && Math.random()>0.975) {
        drops[i]=0;
      }

      drops[i]++;

    });

    matrixAnimation=requestAnimationFrame(drawMatrix);

  }

  drawMatrix();

}

function stopMatrix() {

  cancelAnimationFrame(matrixAnimation);

  document.getElementById("matrix").style.display="none";

}


// RANDOM QUOTES

let quotes=[
  "Stay curious. Keep experimenting.",
  "Small progress is still progress.",
  "Dream in pixels. Think in systems.",
  "Make something amazing today.",
  "One focused hour can change your day.",
  "Build your own future.",
  "Keep learning. Keep building."
];

function newQuote() {

  let q=quotes[Math.floor(Math.random()*quotes.length)];

  document.getElementById("quote").textContent=q;

}


// FULLSCREEN

function fullscreen() {

  if(!document.fullscreenElement) {

    document.documentElement.requestFullscreen?.();

  } else {

    document.exitFullscreen?.();

  }

}

</script>

</body>
</html>
